<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Surge: Scaffolding Challenge</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #161f32;
      --solar: #f59e0b;
      --drain: #ef4444;
      --accent: #06b6d4;
      --powerup: #a855f7;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .game-box {
      background: var(--card-bg);
      border: 4px solid var(--accent);
      border-radius: 20px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
      position: relative;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .score { color: #22c55e; font-size: 1.3rem; font-weight: bold; }
    .phase-badge {
      background: var(--powerup);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .target-screen {
      background: linear-gradient(135deg, #0284c7, #0f172a);
      border-radius: 12px;
      padding: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 15px;
      border: 2px solid #38bdf8;
    }

    .chip-arena {
      background: #0b1120;
      min-height: 100px;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      border: 2px dashed #334155;
      margin-bottom: 15px;
    }
    .chip {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }
    .chip.solar { background: var(--solar); }
    .chip.drain { background: var(--drain); color: white; }

    /* Direct Mode Section */
    .direct-box {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }
    .direct-box input {
      padding: 12px;
      font-size: 1.4rem;
      border-radius: 8px;
      border: 2px solid var(--accent);
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    
    .btn-solar { background: var(--solar); color: black; }
    .btn-drain { background: var(--drain); color: white; }
    .btn-action { background: #3b82f6; color: white; grid-column: span 2; }
    .btn-submit { background: #22c55e; color: white; grid-column: span 2; }

    .feedback {
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="game-box">
  <div class="header-bar">
    <div class="phase-badge" id="phaseBadge">STAGE 1: CHIP MODEL</div>
    <div>⚡ <span class="score" id="score">0</span> PTS</div>
  </div>

  <div class="target-screen" id="targetDisplay">TARGET: +0</div>

  <!-- STAGE 1: Chip Arena -->
  <div id="chipSection">
    <div class="chip-arena" id="arena">
      <span style="color:#64748b;">Build the charge using chips!</span>
    </div>
    <div class="btn-grid">
      <button class="btn-solar" onclick="addChip(1)">+1 Solar ☀️</button>
      <button class="btn-drain" onclick="addChip(-1)">-1 Drain 🔌</button>
      <button class="btn-action" style="background:#64748b;" onclick="zapZeroPairs()">💥 Zap Zero Pairs (+1 & -1)</button>
      <button class="btn-submit" onclick="submitChipAnswer()">⚡ SUBMIT CHIP GRID</button>
    </div>
  </div>

  <!-- STAGE 2: Direct Fast Calculation -->
  <div class="direct-box" id="directSection">
    <input type="number" id="directInput" placeholder="Enter calculated total..." />
    <button class="btn-submit" onclick="submitDirectAnswer()">⚡ SUBMIT ANSWER</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<script>
  let round = 1;
  let score = 0;
  let target = 0;
  let currentChips = [];
  let directSolution = 0;

  function getRandomInt(min, max) {
    let r = 0;
    while(r === 0) r = Math.floor(Math.random() * (max - min + 1)) + min;
    return r;
  }

  function nextRound() {
    document.getElementById('feedback').innerText = "";
    document.getElementById('directInput').value = "";

    if (round <= 3) {
      // STAGE 1: Chip Rounds (First 3 rounds)
      document.getElementById('phaseBadge').innerText = `STAGE 1: CHIP MODEL (${round}/3)`;
      document.getElementById('chipSection').style.display = 'block';
      document.getElementById('directSection').style.display = 'none';
      
      const n1 = getRandomInt(-4, 4);
      const n2 = getRandomInt(-4, 4);
      target = n1 + n2;
      currentChips = [];
      
      document.getElementById('targetDisplay').innerText = `BUILD TARGET: ${target >= 0 ? '+' + target : target}`;
      renderArena();
    } else {
      // STAGE 2: Direct Questions (Round 4+)
      document.getElementById('phaseBadge').innerText = `STAGE 2: SPEED ROUND (${round - 3})`;
      document.getElementById('phaseBadge').style.background = '#06b6d4';
      document.getElementById('chipSection').style.display = 'none';
      document.getElementById('directSection').style.display = 'flex';

      generateDirectQuestion();
    }
  }

  // --- CHIP STAGE LOGIC ---
  function addChip(val) {
    currentChips.push(val);
    renderArena();
  }

  function renderArena() {
    const arena = document.getElementById('arena');
    arena.innerHTML = "";
    if (currentChips.length === 0) {
      arena.innerHTML = '<span style="color:#64748b;">Click buttons to add +1 or -1 chips!</span>';
      return;
    }
    currentChips.forEach(c => {
      const chip = document.createElement('div');
      chip.className = `chip ${c > 0 ? 'solar' : 'drain'}`;
      chip.innerText = c > 0 ? '+1' : '-1';
      arena.appendChild(chip);
    });
  }

  function zapZeroPairs() {
    let pos = currentChips.filter(c => c === 1).length;
    let neg = currentChips.filter(c => c === -1).length;
    if (pos > 0 && neg > 0) {
      currentChips = [...Array(pos - 1).fill(1), ...Array(neg - 1).fill(-1)];
      renderArena();
    }
  }

  function submitChipAnswer() {
    const sum = currentChips.reduce((a, b) => a + b, 0);
    const feedback = document.getElementById('feedback');

    if (sum === target) {
      score += 100;
      round++;
      document.getElementById('score').innerText = score;
      feedback.style.color = '#22c55e';
      feedback.innerText = "✅ Great job! Target matched.";
      setTimeout(nextRound, 800);
    } else {
      feedback.style.color = '#ef4444';
      feedback.innerText = `❌ Grid totals ${sum}. Target is ${target}. Try again!`;
    }
  }

  // --- DIRECT STAGE LOGIC ---
  function generateDirectQuestion() {
    const a = getRandomInt(-10, 10);
    const b = getRandomInt(-10, 10);
    const ops = ['+', '-', '*'];
    const op = ops[Math.floor(Math.random() * ops.length)];

    if (op === '+') directSolution = a + b;
    if (op === '-') directSolution = a - b;
    if (op === '*') directSolution = a * b;

    document.getElementById('targetDisplay').innerText = `SOLVE: (${a > 0 ? '+' + a : a}) ${op === '*' ? '×' : op} (${b > 0 ? '+' + b : b}) = ?`;
  }

  function submitDirectAnswer() {
    const inputVal = parseInt(document.getElementById('directInput').value);
    const feedback = document.getElementById('feedback');

    if (inputVal === directSolution) {
      score += 150;
      round++;
      document.getElementById('score').innerText = score;
      feedback.style.color = '#22c55e';
      feedback.innerText = "⚡ Correct! +150 PTS";
      setTimeout(nextRound, 600);
    } else {
      feedback.style.color = '#ef4444';
      feedback.innerText = `❌ Incorrect. Try again!`;
    }
  }

  nextRound();
</script>
</body>
</html>
