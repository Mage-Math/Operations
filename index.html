<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electricity Chip Model</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --yellow: #eab308;
      --red: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: var(--panel);
      padding: 24px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chip {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
    }
    .chip.yellow { background: var(--yellow); }
    .chip.red { background: var(--red); color: white; }
    
    .problem-box {
      background: #334155;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .table-top {
      background: #0284c7;
      min-height: 120px;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      border: 3px dashed #38bdf8;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }
    .btn-yellow { background: var(--yellow); color: black; }
    .btn-red { background: var(--red); }
    .btn-cancel { background: #64748b; }
    .btn-submit { background: #22c55e; width: 100%; margin-top: 10px; }
    
    .feedback {
      min-height: 30px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>⚡ Electricity Chip Board</h2>
  
  <div class="legend">
    <div class="legend-item"><div class="chip yellow">+1</div> Solar (+1)</div>
    <div class="legend-item"><div class="chip red">-1</div> Drain (-1)</div>
  </div>

  <div class="problem-box" id="problemText">Loading problem...</div>

  <div class="table-top" id="chipTable">
    <!-- Chips appear here -->
  </div>

  <div class="controls">
    <button class="btn-yellow" onclick="addChip(1)">+ Add Solar</button>
    <button class="btn-red" onclick="addChip(-1)">+ Add Drain</button>
  </div>
  <button class="btn-cancel" onclick="cancelPairs()" style="width: 100%;">⚡ Cancel Zero Pairs (+1 & -1)</button>
  
  <button class="btn-submit" onclick="checkSolution()">Check Total Power</button>
  <div class="feedback" id="feedback"></div>
  
  <button onclick="nextRound()" style="background:#475569; width:100%; margin-top:15px;">Next Question</button>
</div>

<script>
  let n1 = 0, n2 = 0, target = 0;
  let currentChips = [];

  function getRandomInt(min, max) {
    let res = 0;
    while (res === 0) res = Math.floor(Math.random() * (max - min + 1)) + min;
    return res;
  }

  function nextRound() {
    n1 = getRandomInt(-5, 5);
    n2 = getRandomInt(-5, 5);
    target = n1 + n2; // Keeping it strictly addition to master chips first
    
    currentChips = [];
    document.getElementById('feedback').innerText = "";
    document.getElementById('problemText').innerText = `Model this expression: (${n1 > 0 ? '+' + n1 : n1}) + (${n2 > 0 ? '+' + n2 : n2})`;
    renderChips();
  }

  function addChip(val) {
    currentChips.push(val);
    renderChips();
  }

  function renderChips() {
    const table = document.getElementById('chipTable');
    table.innerHTML = "";
    if (currentChips.length === 0) {
      table.innerHTML = '<span style="color: #e2e8f0;">Table is empty. Click buttons below to add chips!</span>';
      return;
    }
    
    currentChips.forEach(val => {
      const chip = document.createElement('div');
      chip.className = `chip ${val > 0 ? 'yellow' : 'red'}`;
      chip.innerText = val > 0 ? '+1' : '-1';
      table.appendChild(chip);
    });
  }

  function cancelPairs() {
    let posCount = currentChips.filter(c => c === 1).length;
    let negCount = currentChips.filter(c => c === -1).length;

    let cancelAmount = Math.min(posCount, negCount);
    if (cancelAmount === 0) {
      document.getElementById('feedback').innerText = "No Zero Pairs (+1 and -1) to cancel!";
      document.getElementById('feedback').style.color = "#cbd5e1";
      return;
    }

    // Remove matching pairs
    posCount -= cancelAmount;
    negCount -= cancelAmount;

    currentChips = [
      ...Array(posCount).fill(1),
      ...Array(negCount).fill(-1)
    ];

    document.getElementById('feedback').innerText = `Cancelled ${cancelAmount} zero pair(s)!`;
    document.getElementById('feedback').style.color = "#22c55e";
    renderChips();
  }

  function checkSolution() {
    const totalOnTable = currentChips.reduce((a, b) => a + b, 0);
    const feedback = document.getElementById('feedback');

    if (totalOnTable === target) {
      feedback.style.color = "#22c55e";
      feedback.innerText = `✅ Perfect! Net Charge = ${target > 0 ? '+' + target : target}`;
    } else {
      feedback.style.color = "#ef4444";
      feedback.innerText = `❌ Net charge on board is ${totalOnTable}. Target is ${target}. Keep trying!`;
    }
  }

  nextRound();
</script>
</body>
</html>
