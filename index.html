<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integer Power Grid: Master Challenge</title>
  <style>
    :root {
      --solar: #f59e0b;
      --drain: #ef4444;
      --accent: #10b981;
      --card-bg: #ffffff;
      --text-main: #1e293b;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .game-box {
      background: var(--card-bg);
      border: 2px solid #e2e8f0;
      border-radius: 28px;
      padding: 28px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .game-box.correct-bounce {
      animation: celebrationPulse 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-color: #10b981;
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.25);
    }

    @keyframes celebrationPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #0284c7;
      background: #f0f9ff;
      border-color: #bae6fd;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }
    .sub-tabs {
      background: #f1f5f9;
      padding: 6px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .target-screen {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #bae6fd;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    }

    .main-math {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0284c7;
    }

    .relate-math {
      margin-top: 6px;
      font-size: 1rem;
      font-weight: 700;
      color: #8b5cf6;
      background: #f3e8ff;
      padding: 6px 12px;
      border-radius: 10px;
      display: inline-block;
    }

    .chip-arena {
      background: #f8fafc;
      min-height: 140px;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      border: 3px dashed #cbd5e1;
      margin-bottom: 20px;
      position: relative;
    }

    /* Visual Groups Container */
    .chip-group {
      border: 2px dashed #0284c7;
      background: #f0f9ff;
      border-radius: 16px;
      padding: 12px 14px;
      min-width: 90px;
      min-height: 60px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: popIn 0.25s ease;
    }

    .chip-group-label {
      position: absolute;
      top: -10px;
      left: 12px;
      background: #0284c7;
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 8px;
    }

    .chip {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chip:hover {
      transform: scale(1.15);
      box-shadow: 0 6px 14px rgba(239, 68, 68, 0.3);
    }

    .chip:hover::after {
      content: '✖';
      position: absolute;
      font-size: 0.8rem;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chip.solar { background: #f59e0b; }
    .chip.drain { background: #ef4444; }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .input-box input {
      padding: 16px;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 16px;
      border: 3px solid #38bdf8;
      background: #ffffff;
      color: #0f172a;
      text-align: center;
      outline: none;
    }

    /* Control Panel Grid */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .special-group-controls {
      grid-column: span 2;
      display: flex;
      gap: 10px;
      background: #f0f9ff;
      padding: 12px;
      border-radius: 16px;
      border: 1.5px solid #bae6fd;
      margin-bottom: 4px;
    }

    button {
      font-family: inherit;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:active { transform: scale(0.96); }
    
    .btn-solar { background: #fef3c7; color: #b45309; border: 2px solid #fde047; }
    .btn-solar:hover { background: #fde047; }
    
    .btn-drain { background: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5; }
    .btn-drain:hover { background: #fca5a5; }

    .btn-group-action {
      background: #0284c7;
      color: #ffffff;
      flex: 1;
      font-size: 0.95rem;
    }
    .btn-group-action:hover {
      background: #0369a1;
    }

    .btn-div-action {
      background: #8b5cf6;
      color: #ffffff;
      flex: 1;
      font-size: 0.95rem;
    }
    .btn-div-action:hover {
      background: #7c3aed;
    }
    
    .btn-clear { background: #fce7f3; color: #be185d; border: 2px solid #fbcfe8; }
    .btn-clear:hover { background: #fbcfe8; }
    
    .btn-zap { background: #f1f5f9; color: #475569; border: 2px solid #cbd5e1; }
    .btn-zap:hover { background: #e2e8f0; }
    
    .btn-submit {
      background: #10b981;
      color: #ffffff;
      grid-column: span 2;
      font-size: 1.15rem;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.2);
    }
    .btn-submit:hover {
      background: #059669;
    }

    .feedback {
      min-height: 32px;
      font-size: 1.25rem;
      font-weight: 800;
      margin-top: 14px;
    }
    .score-bar {
      margin-top: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #475569;
    }

    .score-pop {
      display: inline-block;
      animation: scorePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes scorePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); color: #10b981; }
      100% { transform: scale(1); }
    }

    .confetti-particle {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 999;
      border-radius: 2px;
      animation: confettiFall 1.2s ease-out forwards;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) rotate(720deg);
      }
    }
  </style>
</head>
<body>

<div class="game-box" id="gameBox">
  <!-- Operation Selector Tabs -->
  <div class="tab-group" id="opTabs">
    <button class="tab-btn active" onclick="setOperation('add', this)">➕ Addition</button>
    <button class="tab-btn" onclick="setOperation('sub', this)">➖ Subtraction</button>
    <button class="tab-btn" onclick="setOperation('mult', this)">✖ Multiplication</button>
    <button class="tab-btn" onclick="setOperation('div', this)">➗ Division</button>
  </div>

  <!-- Question Type Sub-Tabs -->
  <div class="tab-group sub-tabs" id="typeTabs">
    <button class="tab-btn active" onclick="setQuestionType('chips', this)">🟡 Chip Model</button>
    <button class="tab-btn" onclick="setQuestionType('direct', this)">⚡ Direct Solves</button>
    <button class="tab-btn" onclick="setQuestionType('missing', this)">❓ Find Missing Value</button>
  </div>

  <div class="target-screen">
    <div class="main-math" id="targetDisplay">Loading...</div>
    <div class="relate-math" id="relateDisplay" style="display: none;"></div>
  </div>

  <!-- Mode 1: Interactive Chip Model -->
  <div id="chipSection">
    <div class="chip-arena" id="arena"></div>
    
    <div class="btn-grid">
      <!-- Multiplication Group Controls -->
      <div class="special-group-controls" id="multControls" style="display: none;">
        <button class="btn-group-action" onclick="addGroupOfChips(1)">➕ Add 1 Group of Solar ☀️</button>
        <button class="btn-group-action" onclick="addGroupOfChips(-1)" style="background:#e11d48;">➕ Add 1 Group of Drain 🔌</button>
      </div>

      <!-- Division Equal Sharing Containers Control -->
      <div class="special-group-controls" id="divControls" style="display: none;">
        <button class="btn-div-action" onclick="addDivisionGroupContainer()">📦 Add Share Container</button>
        <button class="btn-div-action" onclick="distributeChipsEqually()" style="background:#6366f1;">⚡ Auto-Distribute Chips</button>
      </div>

      <button class="btn-solar" onclick="addChip(1)">+1 Solar ☀️</button>
      <button class="btn-drain" onclick="addChip(-1)">-1 Drain 🔌</button>
      <button class="btn-clear" onclick="clearChips()">🗑️ Clear All</button>
      <button class="btn-zap" onclick="zapZeroPairs()">💥 Zap Zero Pairs</button>
      <button class="btn-submit" onclick="checkAnswer()">⚡ SUBMIT CHIPS</button>
    </div>
  </div>

  <!-- Mode 2 & 3: Direct or Missing Calculation -->
  <div class="input-box" id="inputSection" style="display: none;">
    <input type="number" id="directInput" placeholder="Enter answer..." />
    <button class="btn-submit" onclick="checkAnswer()">⚡ SUBMIT ANSWER</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="score-bar">Current Score: <b id="score" style="color:#0284c7;">0</b> PTS</div>
</div>

<script>
  let currentOp = 'add';
  let currentType = 'chips';
  let score = 0;
  
  let targetVal = 0;
  let solutionVal = 0;
  let factorA = 0;
  let factorB = 0;

  let chipGroups = [];

  function getRandomInt(min, max) {
    let r = 0;
    while(r === 0) r = Math.floor(Math.random() * (max - min + 1)) + min;
    return r;
  }

  function formatNum(n) {
    return n < 0 ? `(${n})` : `${n}`;
  }

  function setOperation(op, btn) {
    currentOp = op;
    if (btn) updateTabUI('opTabs', btn);
    newQuestion();
  }

  function setQuestionType(type, btn) {
    currentType = type;
    if (btn) updateTabUI('typeTabs', btn);
    newQuestion();
  }

  function updateTabUI(groupId, activeBtn) {
    document.querySelectorAll(`#${groupId} .tab-btn`).forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
  }

  function newQuestion() {
    document.getElementById('feedback').innerText = "";
    document.getElementById('directInput').value = "";
    chipGroups = [];

    const multControls = document.getElementById('multControls');
    const divControls = document.getElementById('divControls');

    multControls.style.display = (currentOp === 'mult' && currentType === 'chips') ? 'flex' : 'none';
    divControls.style.display = (currentOp === 'div' && currentType === 'chips') ? 'flex' : 'none';

    if (currentType === 'chips') {
      document.getElementById('chipSection').style.display = 'block';
      document.getElementById('inputSection').style.display = 'none';
      setupChipQuestion();
    } else {
      document.getElementById('chipSection').style.display = 'none';
      document.getElementById('inputSection').style.display = 'flex';
      if (currentType === 'direct') setupDirectQuestion();
      if (currentType === 'missing') setupMissingQuestion();
    }
  }

  function setupChipQuestion() {
    let a, b;
    const symbolMap = { add: '+', sub: '-', mult: '×', div: '÷' };
    const symbol = symbolMap[currentOp];
    const relateEl = document.getElementById('relateDisplay');

    if (currentOp === 'div') {
      b = getRandomInt(1, 4); 
      let res = getRandomInt(-4, 4);
      a = b * res; 
      targetVal = res;
      factorA = a;
      factorB = b;

      relateEl.style.display = 'inline-block';
      relateEl.innerText = `💡 Relate: ${formatNum(b)} × [ ? ] = ${formatNum(a)}`;
    } else {
      relateEl.style.display = 'none';
      if (currentOp === 'mult') {
        a = getRandomInt(1, 4);
        b = getRandomInt(-4, 4);
        factorA = a;
        factorB = b;
        targetVal = a * b;
      } else if (currentOp === 'sub') {
        a = getRandomInt(-4, 4);
        b = getRandomInt(-4, 4);
        targetVal = a - b;
      } else {
        a = getRandomInt(-5, 5);
        b = getRandomInt(-5, 5);
        targetVal = a + b;
      }
    }

    document.getElementById('targetDisplay').innerText = `MODEL: ${formatNum(a)} ${symbol} ${formatNum(b)} = ?`;
    renderArena();
  }

  function addChip(val) {
    chipGroups.push(val);
    renderArena();
  }

  function addGroupOfChips(chipTypeVal) {
    const groupSize = Math.abs(factorB) || 2;
    const newGroup = Array(groupSize).fill(chipTypeVal);
    chipGroups.push(newGroup);
    renderArena();
  }

  function addDivisionGroupContainer() {
    chipGroups.push([]);
    renderArena();
  }

  function distributeChipsEqually() {
    let flat = chipGroups.flat();
    let containerCount = chipGroups.filter(item => Array.isArray(item)).length;
    
    if (containerCount === 0) {
      containerCount = Math.abs(factorB);
    }

    let containers = Array.from({ length: containerCount }, () => []);
    flat.forEach((chip, i) => {
      containers[i % containerCount].push(chip);
    });

    chipGroups = containers;
    renderArena();
  }

  function removeSpecificChip(groupIndex, chipIndex) {
    if (Array.isArray(chipGroups[groupIndex])) {
      if (chipIndex !== null) {
        chipGroups[groupIndex].splice(chipIndex, 1);
      } else {
        chipGroups.splice(groupIndex, 1);
      }
    } else {
      chipGroups.splice(groupIndex, 1);
    }
    renderArena();
  }

  function clearChips() {
    chipGroups = [];
    renderArena();
  }

  function renderArena() {
    const arena = document.getElementById('arena');
    arena.innerHTML = "";

    if (chipGroups.length === 0) {
      arena.innerHTML = '<span style="color:#94a3b8; font-weight:600;">Add chips, groups, or equal share containers!</span>';
      return;
    }

    chipGroups.forEach((item, gIdx) => {
      if (Array.isArray(item)) {
        const groupEl = document.createElement('div');
        groupEl.className = 'chip-group';

        const label = document.createElement('span');
        label.className = 'chip-group-label';
        label.innerText = `Container ${gIdx + 1}`;
        groupEl.appendChild(label);

        if (item.length === 0) {
          const emptyText = document.createElement('span');
          emptyText.style.color = '#94a3b8';
          emptyText.style.fontSize = '0.75rem';
          emptyText.innerText = 'Empty';
          groupEl.appendChild(emptyText);
        } else {
          item.forEach((c, cIdx) => {
            const chip = document.createElement('div');
            chip.className = `chip ${c > 0 ? 'solar' : 'drain'}`;
            chip.innerText = c > 0 ? '+1' : '-1';
            chip.title = "Click to remove chip";
            chip.onclick = () => removeSpecificChip(gIdx, cIdx);
            groupEl.appendChild(chip);
          });
        }

        arena.appendChild(groupEl);
      } else {
        const chip = document.createElement('div');
        chip.className = `chip ${item > 0 ? 'solar' : 'drain'}`;
        chip.innerText = item > 0 ? '+1' : '-1';
        chip.title = "Click to remove chip";
        chip.onclick = () => removeSpecificChip(gIdx, null);
        arena.appendChild(chip);
      }
    });
  }

  function zapZeroPairs() {
    let flatChips = chipGroups.flat();
    let pos = flatChips.filter(c => c === 1).length;
    let neg = flatChips.filter(c => c === -1).length;
    
    if (pos > 0 && neg > 0) {
      const remainingPos = pos - 1;
      const remainingNeg = neg - 1;
      chipGroups = [...Array(remainingPos).fill(1), ...Array(remainingNeg).fill(-1)];
      renderArena();
    }
  }

  function setupDirectQuestion() {
    let a, b;
    const symbolMap = { add: '+', sub: '-', mult: '×', div: '÷' };
    const symbol = symbolMap[currentOp];
    const relateEl = document.getElementById('relateDisplay');

    if (currentOp === 'div') {
      b = getRandomInt(-5, 5);
      let res = getRandomInt(-6, 6);
      a = b * res;
      solutionVal = Math.round(a / b);

      relateEl.style.display = 'inline-block';
      relateEl.innerText = `💡 Relate: ${formatNum(b)} × [ ? ] = ${formatNum(a)}`;
    } else {
      relateEl.style.display = 'none';
      a = getRandomInt(-10, 10);
      b = getRandomInt(-10, 10);
      if (currentOp === 'add') solutionVal = a + b;
      if (currentOp === 'sub') solutionVal = a - b;
      if (currentOp === 'mult') solutionVal = a * b;
    }

    document.getElementById('targetDisplay').innerText = `SOLVE: ${formatNum(a)} ${symbol} ${formatNum(b)} = ?`;
  }

  function setupMissingQuestion() {
    let a, b;
    const relateEl = document.getElementById('relateDisplay');
    relateEl.style.display = 'none';

    if (currentOp === 'div') {
      b = getRandomInt(-5, 5);
      let res = getRandomInt(-6, 6);
      a = b * res;
      solutionVal = b;
      document.getElementById('targetDisplay').innerText = `FIND MISSING: ${formatNum(a)} ÷ [ ? ] = ${Math.round(a / b)}`;
    } else {
      a = getRandomInt(-10, 10);
      b = getRandomInt(-10, 10);
      solutionVal = b;

      if (currentOp === 'add') {
        document.getElementById('targetDisplay').innerText = `FIND MISSING: ${formatNum(a)} + [ ? ] = ${a + b}`;
      } else if (currentOp === 'sub') {
        document.getElementById('targetDisplay').innerText = `FIND MISSING: ${formatNum(a)} - [ ? ] = ${a - b}`;
      } else if (currentOp === 'mult') {
        document.getElementById('targetDisplay').innerText = `FIND MISSING: ${formatNum(a)} × [ ? ] = ${a * b}`;
      }
    }
  }

  function triggerCelebration() {
    const gameBox = document.getElementById('gameBox');
    gameBox.classList.add('correct-bounce');
    setTimeout(() => gameBox.classList.remove('correct-bounce'), 600);

    const scoreEl = document.getElementById('score');
    scoreEl.classList.add('score-pop');
    setTimeout(() => scoreEl.classList.remove('score-pop'), 400);

    const colors = ['#f59e0b', '#10b981', '#0284c7', '#ec4899', '#8b5cf6'];
    const rect = gameBox.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 3;

    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-particle';
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = centerX + 'px';
      p.style.top = centerY + 'px';

      const angle = Math.random() * Math.PI * 2;
      const velocity = 80 + Math.random() * 150;
      const dx = Math.cos(angle) * velocity + 'px';
      const dy = (Math.sin(angle) * velocity - 50) + 'px';

      p.style.setProperty('--dx', dx);
      p.style.setProperty('--dy', dy);

      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  }

  function checkAnswer() {
    const feedback = document.getElementById('feedback');
    let isCorrect = false;

    if (currentType === 'chips') {
      const flatChips = chipGroups.flat();
      const chipSum = flatChips.reduce((x, y) => x + y, 0);
      isCorrect = (chipSum === targetVal);
    } else {
      const inputVal = parseInt(document.getElementById('directInput').value);
      isCorrect = (inputVal === solutionVal);
    }

    if (isCorrect) {
      score += 100;
      document.getElementById('score').innerText = score;
      feedback.style.color = '#10b981';
      feedback.innerText = "🌟 Great Job! +100 PTS";
      
      triggerCelebration();
      setTimeout(newQuestion, 1000);
    } else {
      feedback.style.color = '#ef4444';
      feedback.innerText = "❌ Try again!";
    }
  }

  window.onload = function() {
    newQuestion();
  };
</script>
</body>
</html>
