<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integer Power Grid: Master Challenge</title>
  <style>
    :root {
      --solar: #f59e0b;
      --drain: #ef4444;
      --accent: #06b6d4;
      --active-tab: #3b82f6;
      --panel-bg: rgba(22, 31, 50, 0.75);
    }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      /* Dynamic glowing radial backdrop */
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .game-box {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(6, 182, 212, 0.2);
    }
    
    /* Navigation Tabs */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .tab-btn:hover {
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border-color: #60a5fa;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }
    .sub-tabs {
      background: rgba(15, 23, 42, 0.6);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 18px;
    }

    .target-screen {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.8), rgba(15, 23, 42, 0.9));
      border-radius: 16px;
      padding: 18px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Chip Stage UI */
    .chip-arena {
      background: rgba(11, 17, 32, 0.8);
      min-height: 110px;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      border: 2px dashed rgba(51, 65, 85, 0.8);
      margin-bottom: 18px;
    }
    .chip {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .chip.solar { background: var(--solar); box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    .chip.drain { background: var(--drain); color: white; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* Direct & Missing Modes UI */
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }
    .input-box input {
      padding: 14px;
      font-size: 1.4rem;
      font-weight: 700;
      border-radius: 12px;
      border: 2px solid var(--accent);
      background: rgba(15, 23, 42, 0.9);
      color: white;
      text-align: center;
      outline: none;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      font-family: inherit;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:active { transform: scale(0.96); }
    
    .btn-solar { background: var(--solar); color: black; }
    .btn-solar:hover { background: #fcd34d; }
    
    .btn-drain { background: var(--drain); color: white; }
    .btn-drain:hover { background: #f87171; }
    
    .btn-undo { background: #e11d48; color: white; }
    .btn-undo:hover { background: #f43f5e; }
    
    .btn-zap { background: #64748b; color: white; }
    .btn-zap:hover { background: #94a3b8; }
    
    .btn-submit {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      grid-column: span 2;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }
    .btn-submit:hover {
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
    }

    .feedback {
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 12px;
    }
    .score-bar {
      margin-top: 15px;
      font-size: 1rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="game-box">
  <!-- Operation Selector Tabs -->
  <div class="tab-group" id="opTabs">
    <button class="tab-btn active" onclick="setOperation('add')">➕ Addition</button>
    <button class="tab-btn" onclick="setOperation('sub')">➖ Subtraction</button>
    <button class="tab-btn" onclick="setOperation('mult')">✖️️ Multiplication</button>
  </div>

  <!-- Question Type Sub-Tabs -->
  <div class="tab-group sub-tabs" id="typeTabs">
    <button class="tab-btn active" onclick="setQuestionType('chips')">🟡 Chip Model</button>
    <button class="tab-btn" onclick="setQuestionType('direct')">⚡ Direct Solves</button>
    <button class="tab-btn" onclick="setQuestionType('missing')">❓ Find Missing Value</button>
  </div>

  <div class="target-screen" id="targetDisplay">Loading...</div>

  <!-- Mode 1: Chip Model -->
  <div id="chipSection">
    <div class="chip-arena" id="arena"></div>
    <div class="btn-grid">
      <button class="btn-solar" onclick="addChip(1)">+1 Solar ☀️</button>
      <button class="btn-drain" onclick="addChip(-1)">-1 Drain 🔌</button>
      <button class="btn-undo" onclick="undoChip()">↩️ Undo Chip</button>
      <button class="btn-zap" onclick="zapZeroPairs()">💥 Zap Zero Pairs</button>
      <button class="btn-submit" onclick="checkAnswer()">⚡ SUBMIT CHIPS</button>
    </div>
  </div>

  <!-- Mode 2 & 3: Direct or Missing Calculation -->
  <div class="input-box" id="inputSection" style="display: none;">
    <input type="number" id="directInput" placeholder="Enter answer..." />
    <button class="btn-submit" onclick="checkAnswer()">⚡ SUBMIT ANSWER</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="score-bar">Current Score: <b id="score" style="color:var(--solar);">0</b> PTS</div>
</div>

<script>
  let currentOp = 'add';
  let currentType = 'chips';
  let score = 0;
  
  let targetVal = 0;
  let solutionVal = 0;
  let currentChips = [];

  function getRandomInt(min, max) {
    let r = 0;
    while(r === 0) r = Math.floor(Math.random() * (max - min + 1)) + min;
    return r;
  }

  function setOperation(op) {
    currentOp = op;
    updateTabUI('opTabs', event.target);
    newQuestion();
  }

  function setQuestionType(type) {
    currentType = type;
    updateTabUI('typeTabs', event.target);
    newQuestion();
  }

  function updateTabUI(groupId, activeBtn) {
    document.querySelectorAll(`#${groupId} .tab-btn`).forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
  }

  function newQuestion() {
    document.getElementById('feedback').innerText = "";
    document.getElementById('directInput').value = "";
    currentChips = [];

    if (currentType === 'chips') {
      document.getElementById('chipSection').style.display = 'block';
      document.getElementById('inputSection').style.display = 'none';
      setupChipQuestion();
    } else {
      document.getElementById('chipSection').style.display = 'none';
      document.getElementById('inputSection').style.display = 'flex';
      if (currentType === 'direct') setupDirectQuestion();
      if (currentType === 'missing') setupMissingQuestion();
    }
  }

  // --- 1. CHIP MODEL LOGIC ---
  function setupChipQuestion() {
    let a = getRandomInt(-4, 4);
    let b = getRandomInt(-4, 4);

    if (currentOp === 'add') targetVal = a + b;
    if (currentOp === 'sub') targetVal = a - b;
    if (currentOp === 'mult') targetVal = a * b;

    document.getElementById('targetDisplay').innerText = `BUILD GRID TARGET: ${targetVal >= 0 ? '+' + targetVal : targetVal}`;
    renderArena();
  }

  function addChip(val) {
    currentChips.push(val);
    renderArena();
  }

  function undoChip() {
    if (currentChips.length > 0) {
      currentChips.pop();
      renderArena();
      document.getElementById('feedback').innerText = "";
    } else {
      const feedback = document.getElementById('feedback');
      feedback.style.color = "#94a3b8";
      feedback.innerText = "No chips to undo!";
    }
  }

  function renderArena() {
    const arena = document.getElementById('arena');
    arena.innerHTML = "";
    if (currentChips.length === 0) {
      arena.innerHTML = '<span style="color:#64748b;">Add +1 Solar or -1 Drain chips!</span>';
      return;
    }
    currentChips.forEach(c => {
      const chip = document.createElement('div');
      chip.className = `chip ${c > 0 ? 'solar' : 'drain'}`;
      chip.innerText = c > 0 ? '+1' : '-1';
      arena.appendChild(chip);
    });
  }

  function zapZeroPairs() {
    let pos = currentChips.filter(c => c === 1).length;
    let neg = currentChips.filter(c => c === -1).length;
    if (pos > 0 && neg > 0) {
      currentChips = [...Array(pos - 1).fill(1), ...Array(neg - 1).fill(-1)];
      renderArena();
    }
  }

  // --- 2. DIRECT QUESTION SETUP ---
  function setupDirectQuestion() {
    let a = getRandomInt(-10, 10);
    let b = getRandomInt(-10, 10);
    const symbol = currentOp === 'add' ? '+' : (currentOp === 'sub' ? '-' : '×');

    if (currentOp === 'add') solutionVal = a + b;
    if (currentOp === 'sub') solutionVal = a - b;
    if (currentOp === 'mult') solutionVal = a * b;

    document.getElementById('targetDisplay').innerText = `SOLVE: (${a > 0 ? '+' + a : a}) ${symbol} (${b > 0 ? '+' + b : b}) = ?`;
  }

  // --- 3. MISSING VALUE SETUP ---
  function setupMissingQuestion() {
    let a = getRandomInt(-10, 10);
    let b = getRandomInt(-10, 10);

    if (currentOp === 'add') {
      solutionVal = b;
      document.getElementById('targetDisplay').innerText = `FIND MISSING: (${a >
