<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integer Power Grid: Operations & Modes</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #161f32;
      --solar: #f59e0b;
      --drain: #ef4444;
      --accent: #06b6d4;
      --active-tab: #3b82f6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .game-box {
      background: var(--card-bg);
      border: 3px solid var(--accent);
      border-radius: 20px;
      padding: 20px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
    }
    
    /* Navigation Tabs */
    .tab-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--active-tab);
      color: white;
      border-color: var(--active-tab);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
    .sub-tabs {
      background: #0f172a;
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .target-screen {
      background: linear-gradient(135deg, #0284c7, #0f172a);
      border-radius: 12px;
      padding: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 15px;
      border: 2px solid #38bdf8;
    }

    /* Chip Stage UI */
    .chip-arena {
      background: #0b1120;
      min-height: 100px;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      border: 2px dashed #334155;
      margin-bottom: 15px;
    }
    .chip {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: bold;
      color: #000;
    }
    .chip.solar { background: var(--solar); }
    .chip.drain { background: var(--drain); color: white; }

    /* Direct & Missing Modes UI */
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }
    .input-box input {
      padding: 12px;
      font-size: 1.3rem;
      border-radius: 8px;
      border: 2px solid var(--accent);
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      font-family: inherit;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-solar { background: var(--solar); color: black; }
    .btn-drain { background: var(--drain); color: white; }
    .btn-submit { background: #22c55e; color: white; grid-column: span 2; font-size: 1.1rem; }

    .feedback {
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 12px;
    }
    .score-bar {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="game-box">
  <!-- Operation Selector Tabs -->
  <div class="tab-group" id="opTabs">
    <button class="tab-btn active" onclick="setOperation('add')">➕ Addition</button>
    <button class="tab-btn" onclick="setOperation('sub')">➖ Subtraction</button>
    <button class="tab-btn" onclick="setOperation('mult')">✖️ Multiplication</button>
  </div>

  <!-- Question Type Sub-Tabs -->
  <div class="tab-group sub-tabs" id="typeTabs">
    <button class="tab-btn active" onclick="setQuestionType('chips')">🟡 Chip Model</button>
    <button class="tab-btn" onclick="setQuestionType('direct')">⚡ Direct Solves</button>
    <button class="tab-btn" onclick="setQuestionType('missing')">❓ Find Missing Value</button>
  </div>

  <div class="target-screen" id="targetDisplay">Loading...</div>

  <!-- Mode 1: Chip Model -->
  <div id="chipSection">
    <div class="chip-arena" id="arena"></div>
    <div class="btn-grid">
      <button class="btn-solar" onclick="addChip(1)">+1 Solar ☀️</button>
      <button class="btn-drain" onclick="addChip(-1)">-1 Drain 🔌</button>
      <button class="btn-submit" style="background:#64748b;" onclick="zapZeroPairs()">💥 Zap Zero Pairs (+1 & -1)</button>
      <button class="btn-submit" onclick="checkAnswer()">⚡ SUBMIT CHIPS</button>
    </div>
  </div>

  <!-- Mode 2 & 3: Direct or Missing Calculation -->
  <div class="input-box" id="inputSection" style="display: none;">
    <input type="number" id="directInput" placeholder="Enter answer..." />
    <button class="btn-submit" onclick="checkAnswer()">⚡ SUBMIT ANSWER</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="score-bar">Current Score: <b id="score" style="color:var(--solar);">0</b> PTS</div>
</div>

<script>
  let currentOp = 'add';
  let currentType = 'chips';
  let score = 0;
  
  let targetVal = 0;
  let solutionVal = 0;
  let currentChips = [];

  function getRandomInt(min, max) {
    let r = 0;
    while(r === 0) r = Math.floor(Math.random() * (max - min + 1)) + min;
    return r;
  }

  function setOperation(op) {
    currentOp = op;
    updateTabUI('opTabs', event.target);
    newQuestion();
  }

  function setQuestionType(type) {
    currentType = type;
    updateTabUI('typeTabs', event.target);
    newQuestion();
  }

  function updateTabUI(groupId, activeBtn) {
    document.querySelectorAll(`#${groupId} .tab-btn`).forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
  }

  function newQuestion() {
    document.getElementById('feedback').innerText = "";
    document.getElementById('directInput').value = "";
    currentChips = [];

    // Toggle visible section
    if (currentType === 'chips') {
      document.getElementById('chipSection').style.display = 'block';
      document.getElementById('inputSection').style.display = 'none';
      setupChipQuestion();
    } else {
      document.getElementById('chipSection').style.display = 'none';
      document.getElementById('inputSection').style.display = 'flex';
      if (currentType === 'direct') setupDirectQuestion();
      if (currentType === 'missing') setupMissingQuestion();
    }
  }

  // --- 1. CHIP MODEL SETUP ---
  function setupChipQuestion() {
    let a = getRandomInt(-4, 4);
    let b = getRandomInt(-4, 4);

    if (currentOp === 'add') targetVal = a + b;
    if (currentOp === 'sub') targetVal = a - b;
    if (currentOp === 'mult') targetVal = a * b;

    const symbol = currentOp === 'add' ? '+' : (currentOp === 'sub' ? '-' : '×');
    document.getElementById('targetDisplay').innerText = `BUILD GRID TARGET: ${targetVal >= 0 ? '+' + targetVal : targetVal}`;
    renderArena();
  }

  function addChip(val) {
    currentChips.push(val);
    renderArena();
  }

  function renderArena() {
    const arena = document.getElementById('arena');
    arena.innerHTML = "";
    if (currentChips.length === 0) {
      arena.innerHTML = '<span style="color:#64748b;">Add +1 Solar or -1 Drain chips!</span>';
      return;
    }
    currentChips.forEach(c => {
      const chip = document.createElement('div');
      chip.className = `chip ${c > 0 ? 'solar' : 'drain'}`;
      chip.innerText = c > 0 ? '+1' : '-1';
      arena.appendChild(chip);
    });
  }

  function zapZeroPairs() {
    let pos = currentChips.filter(c => c === 1).length;
    let neg = currentChips.filter(c => c === -1).length;
    if (pos > 0 && neg > 0) {
      currentChips = [...Array(pos - 1).fill(1), ...Array(neg - 1).fill(-1)];
      renderArena();
    }
  }

  // --- 2. DIRECT QUESTION SETUP ---
  function setupDirectQuestion() {
    let a = getRandomInt(-10, 10);
    let b = getRandomInt(-10, 10);
    const symbol = currentOp === 'add' ? '+' : (currentOp === 'sub' ? '-' : '×');

    if (currentOp === 'add') solutionVal = a + b;
    if (currentOp === 'sub') solutionVal = a - b;
    if (currentOp === 'mult') solutionVal = a * b;

    document.getElementById('targetDisplay').innerText = `SOLVE: (${a > 0 ? '+' + a : a}) ${symbol} (${b > 0 ? '+' + b : b}) = ?`;
  }

  // --- 3. MISSING VALUE SETUP ---
  function setupMissingQuestion() {
    let a = getRandomInt(-10, 10);
    let b = getRandomInt(-10, 10);
    const symbol = currentOp === 'add' ? '+' : (currentOp === 'sub' ? '-' : '×');

    if (currentOp === 'add') {
      solutionVal = b;
      document.getElementById('targetDisplay').innerText = `FIND MISSING: (${a > 0 ? '+' + a : a}) + [ ? ] = ${a + b}`;
    } else if (currentOp === 'sub') {
      solutionVal = b;
      document.getElementById('targetDisplay').innerText = `FIND MISSING: (${a > 0 ? '+' + a : a}) - [ ? ] = ${a - b}`;
    } else if (currentOp === 'mult') {
      solutionVal = b;
      document.getElementById('targetDisplay').innerText = `FIND MISSING: (${a > 0 ? '+' + a : a}) × [ ? ] = ${a * b}`;
    }
  }

  // --- ANSWER CHECKING ---
  function checkAnswer() {
    const feedback = document.getElementById('feedback');
    let isCorrect = false;

    if (currentType === 'chips') {
      const chipSum = currentChips.reduce((x, y) => x + y, 0);
      isCorrect = (chipSum === targetVal);
    } else {
      const inputVal = parseInt(document.getElementById('directInput').value);
      isCorrect = (inputVal === solutionVal);
    }

    if (isCorrect) {
      score += 100;
      document.getElementById('score').innerText = score;
      feedback.style.color = '#22c55e';
      feedback.innerText = "⚡ Correct! +100 PTS";
      setTimeout(newQuestion, 800);
    } else {
      feedback.style.color = '#ef4444';
      feedback.innerText = "❌ Short circuit! Try again.";
    }
  }

  newQuestion();
</script>
</body>
</html>
